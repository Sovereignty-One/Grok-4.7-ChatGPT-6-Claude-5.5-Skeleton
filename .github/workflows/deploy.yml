name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt flake8

      - name: Lint
        run: |
          python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --max-line-length=120

      - name: Run tests
        run: python -m pytest --tb=short -q
        env:
          DATABASE_URL: sqlite:///./test.db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci-only-not-production-use-1234

  security-sentinel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Syntax check security sentinel
        run: python -m py_compile security_sentinel.py

      - name: Run security sentinel single-pass check
        run: python security_sentinel.py --check
        env:
          SENTINEL_LOG_DIR: ${{ runner.temp }}/sentinel-logs
          SENTINEL_PID_FILE: ${{ runner.temp }}/sentinel.pid

  build:
    needs: [test, security-sentinel]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify deploy file layout
        run: |
          set -euxo pipefail
          for file in Dockerfile.backend supergrok-enterprise/Dockerfile supergrok-enterprise/index.html docker-compose.yml security_sentinel.py backend.py secure_enclave.py; do
            test -f "$file" || { echo "::error::Missing required deploy file: $file"; exit 1; }
          done

      - name: Build backend Docker image
        run: docker build -t sovereignty-backend -f Dockerfile.backend .

      - name: Build frontend Docker image
        run: docker build -t sovereignty-frontend ./supergrok-enterprise

      - name: Verify Docker Compose config
        run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: ci-test-password
          SECRET_KEY: ci-test-secret-key-for-validation-only-1234
          KEYCLOAK_ADMIN_PASSWORD: ci-test-keycloak-password
