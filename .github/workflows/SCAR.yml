name: SCAR — Fail-Closed Integrity Gate

on:
  push:
    branches: ['Collaboration', 'main', 'xAI/Grok/**', 'chatgpt/**']
  pull_request:
    branches: ['Collaboration', 'main']
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for this SCAR integrity run'
        required: false
        default: 'manual-integrity-check'

permissions:
  contents: read

concurrency:
  group: scar-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scar-integrity:
    name: SCAR integrity and tamper tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Compile verifier
        run: python -m py_compile scripts/scar_pqc_attest.py
      - name: Unit and negative tests
        run: python -m unittest discover -s tests -p 'test_scar_pqc_attest.py' -v
      - name: Verify committed SCAR chain
        run: python scripts/scar_pqc_attest.py --records SCAR.jsonl
      - name: Report scope honestly
        if: success()
        run: |
          echo "SCAR_INTEGRITY=PASS"
          echo "SCAR_SIGNATURE_VERIFICATION=NOT_IMPLEMENTED"
          echo "SCAR_PQC_ATTESTATION=NOT_IMPLEMENTED"
          echo "SCAR_HARDWARE_ATTESTATION=NOT_IMPLEMENTED"
