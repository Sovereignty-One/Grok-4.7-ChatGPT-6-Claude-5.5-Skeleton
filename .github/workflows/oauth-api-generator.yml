name: OAuth API Generator — Validation & Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - "**/*.py"
      - "**/*.js"
      - "requirements*.txt"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/oauth-api-generator.yml"
      - "!docs/**"
      - "!**/*.md"
  pull_request:
    branches: [main]
    paths:
      - "**/*.py"
      - "**/*.js"
      - "requirements*.txt"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/oauth-api-generator.yml"
      - "!docs/**"
      - "!**/*.md"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oauth-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate OAuth API runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile Python entry points
        run: python -m py_compile backend.py

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package.json

      - name: Install Node dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate Node.js entry point
        run: node --check Unified_Server.js

  release-container:
    name: Build and publish signed release image
    needs: validate
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@68827325e0b33c7199eb31dd4e31fbe9023e06e3 # v3.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        shell: bash
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991 # v6.18.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0

      - name: Sign published image
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: cosign sign --yes ${{ env.IMAGE }}:${{ github.sha }}
