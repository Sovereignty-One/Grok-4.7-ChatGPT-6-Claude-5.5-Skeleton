name: Python CI

on:
  push:
    branches: [ "main", "devassist420" ]
  pull_request:
    branches: [ "main", "devassist420" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest

      - name: Lint
        continue-on-error: false
        run: ruff check .

      - name: Type check
        continue-on-error: false
        run: mypy .

      - name: Run tests
        run: pytest
