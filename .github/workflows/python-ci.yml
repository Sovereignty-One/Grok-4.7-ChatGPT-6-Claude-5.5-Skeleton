name: Python CI — Lint & Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Python lint and test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check ruff

      - name: Lint critical Python errors
        run: >-
          python -m ruff check .
          --select E9,F63,F7,F82
          --output-format=github

      - name: Run Python test suite
        run: python -m pytest --tb=short -q
        env:
          SECRET_KEY: ci-only-not-for-production
          SG_BRAIN_SIGNING_KEY: 1111111111111111111111111111111111111111111111111111111111111111
